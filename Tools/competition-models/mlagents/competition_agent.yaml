behaviors:
  CompetitionAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000

env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  seed: 0

engine_settings:
  width: 1280
  height: 720
  quality_level: 1
  time_scale: 1
  target_frame_rate: 60
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: competition_agent
  initialize_from: null
  load_model: false
  resume: false
  force: true
  train_model: true
  inference: false

torch_settings:
  device: cpu

debug: false
